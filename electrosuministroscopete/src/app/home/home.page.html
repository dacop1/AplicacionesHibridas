<!-- Cabecera principal de la aplicación -->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <img slot="start" src="assets/img/logo1.jpg" alt="Logo Electrosuministros Copete" class="logo"> <!-- AÑADIDO -->
    <ion-title>
      Electrosuministros Copete
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!--
    Directiva *ngIf: mostramos un mensaje si no hay suministros.
    Si listaDeSuministros está vacío, se mostrará este mensaje.
  -->
  <div *ngIf="listaDeSuministros.length === 0" class="mensaje-vacio">
    <p>El inventario está vacío.</p>
    <p>No hay suministros registrados.</p>
  </div>

  <!--
    Directiva *ngFor: recorremos el array de suministros.
    Por cada suministro, Angular crea un componente
    SuministroItemComponent.
  -->

<ion-grid>
  <ion-row>
    <!-- El *ngFor va en la columna: se crea una columna por cada suministro -->
    <ion-col
      *ngFor="let suministro of listaDeSuministros"
      size="12"
      size-sm="6"
      size-lg="4">
      <app-suministro-item [suministroscopete]="suministro"></app-suministro-item>
    </ion-col>
  </ion-row>
</ion-grid>


</ion-content>
