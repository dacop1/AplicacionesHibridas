<!-- Cabecera principal de la aplicación -->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <img slot="start" src="assets/img/logo1.jpg" alt="Logo Electrosuministros Copete" class="logo"> <!-- AÑADIDO -->
    <ion-title>
      <ion-icon name="warning" color="warning"></ion-icon> <!-- AÑADIDO: icono de peligro izquierdo -->
      Electrosuministros Copete
      <ion-icon name="warning" color="warning"></ion-icon> <!-- AÑADIDO: icono de peligro derecho -->
    </ion-title>
    <!-- AÑADIDO: botón de ajustes -->
    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!--
    Directiva *ngIf: mostramos un mensaje si no hay suministros.
    Si listaDeSuministros está vacío, se mostrará este mensaje.
  -->
  <div *ngIf="listaDeSuministros.length === 0" class="mensaje-vacio">
    <p>El inventario está vacío.</p>
    <p>No hay suministros registrados.</p>
  </div>




    <!-- AÑADIDO 3.9: formulario para añadir suministros -->
  <div class="ion-padding">
    <ion-list>
      <ion-item>
        <ion-input label="Nombre" label-placement="floating" placeholder="Ej: Cable rojo 4 mm"
          [(ngModel)]="nuevoSuministro.nombre"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Categoría" label-placement="floating" placeholder="Ej: Cables"
          [(ngModel)]="nuevoSuministro.categoria"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Marca" label-placement="floating" placeholder="Ej: Prysmian"
          [(ngModel)]="nuevoSuministro.marca"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Precio (€)" label-placement="floating" type="number"
          [(ngModel)]="nuevoSuministro.precio"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Stock" label-placement="floating" type="number"
          [(ngModel)]="nuevoSuministro.stock"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="agregarSuministro()" class="ion-margin-top">
      Añadir suministro
    </ion-button>
  </div>
  
  <!-- AÑADIDO 3.11: SKELETON, solo mientras cargando es true -->
  <ion-grid *ngIf="cargando">
    <ion-row>
      <ion-col *ngFor="let i of [1, 2, 3, 4, 5, 6]" size="12" size-sm="6" size-lg="4">
        <ion-card class="card-skeleton">
          <!-- Foto -->
          <ion-skeleton-text [animated]="true" class="skeleton-img"></ion-skeleton-text>
          <ion-item>
            <ion-checkbox slot="start" [disabled]="true" aria-label="Cargando"></ion-checkbox>
            <ion-label>
              <h2><ion-skeleton-text [animated]="true" style="width: 70%;"></ion-skeleton-text></h2>
              <p><ion-skeleton-text [animated]="true" style="width: 40%;"></ion-skeleton-text></p>
              <p><ion-skeleton-text [animated]="true" style="width: 50%;"></ion-skeleton-text></p>
              <p><ion-skeleton-text [animated]="true" style="width: 30%;"></ion-skeleton-text></p>
            </ion-label>
            <!-- Botón "Ver" -->
            <ion-skeleton-text slot="end" [animated]="true" class="skeleton-boton"></ion-skeleton-text>
          </ion-item>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!--
    Directiva *ngFor: recorremos el array de suministros.
    Por cada suministro, Angular crea un componente
    SuministroItemComponent.
  -->

  <ion-grid *ngIf="!cargando"> <!-- CAMBIADO 3.11: solo se ve cuando ya ha cargado -->
    <ion-row>
      <!-- El *ngFor va en la columna: se crea una columna por cada suministro -->
      <ion-col *ngFor="let suministro of listaDeSuministros" size="12" size-sm="6" size-lg="4">
        <app-suministro-item [suministroscopete]="suministro"></app-suministro-item>
      </ion-col>
    </ion-row>
  </ion-grid>


</ion-content>
