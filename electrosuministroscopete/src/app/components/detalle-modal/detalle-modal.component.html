<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Detalle del suministro</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>{{ suministro.nombre }}</h2>
  <p>{{ suministro.descripcion }}</p>

  <ion-list>
    <ion-item>
      <ion-label>Categoría</ion-label>
      <ion-note slot="end">{{ suministro.categoria }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Marca</ion-label>
      <ion-note slot="end">{{ suministro.marca }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Referencia</ion-label>
      <ion-note slot="end">{{ suministro.referencia }}</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Precio</ion-label>
      <ion-note slot="end">{{ suministro.precio }} €</ion-note>
    </ion-item>
    <ion-item>
      <ion-label>Stock</ion-label>
      <ion-note slot="end">{{ suministro.stock }} uds.</ion-note>
    </ion-item>
  </ion-list>
</ion-content>
